<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- ===== BOX ICONS ===== -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <title>Toran Rokka · Cyber Security Portfolio</title>
</head>
<body>

<!--===== CONTACT =====-->
<section class="contact section" id="contact">
    <h2 class="section-title">Contact</h2>

    <div class="contact__container bd-grid">
        <div class="contact__info">
            <h3 class="contact__subtitle">EMAIL</h3>
            <span class="contact__text">toranrokka1@gmail.com</span>
        </div>

        <form id="contact-form" class="contact__form">
            <div class="contact__inputs">
                <input type="text" name="name" placeholder="Name" class="contact__input" required>
                <input type="email" id="email" name="email" placeholder="Email" class="contact__input" required>
            </div>

            <textarea name="message" rows="10" class="contact__input" placeholder="Your message..." required></textarea>

            <input type="submit" value="Send Message" class="contact__button">
        </form>
    </div>
</section>

<!--===== SCRIPT =====-->
<script>
document.getElementById("contact-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const emailInput = document.getElementById("email").value;

    // 🔒 CHANGE THIS DOMAIN IF NEEDED
    const allowedDomain = "@gmail.com";

    if (!emailInput.endsWith(allowedDomain)) {
        alert("Please use a valid email with domain " + allowedDomain);
        return;
    }

    const form = e.target;
    const data = new FormData(form);

    try {
        const response = await fetch("https://formspree.io/f/xnjopdpg", {
            method: "POST",
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        });

        if (response.ok) {
            alert("Message received! I will contact you as soon as possible.");
            form.reset();
        } else {
            alert("Oops! Something went wrong. Try again.");
        }
    } catch (error) {
        alert("Network error. Please try again.");
    }
});
</script>

</body>
</html>
